# P3 overnight template (`3.4_todo.md` §5.2, plan B: single card on GPU4).
#
# THIS FILE IS A TEMPLATE. `scripts/p3/render_cfg.sh` copies it to
# `_overnight.generated.yaml` and injects the three values that only the S5 sweep
# can decide:
#
#   batch_size        <- gates/decision.json: bs
#   grad_accum_steps  <- 32 // bs          (equivalent batch stays 32 = 128k samples)
#   optimizer.type    <- gates/decision.json: adamw | adafactor
#
# Everything else (bridge, 4000 steps, save_freq 250, wandb off) is fixed here on
# purpose: config names map to output dirs, so a hand-edited copy would silently
# start a fresh run instead of resuming.
#
# First run = bridge (17_784 frames, 556 step/epoch); fractal 12_000 stays on GPU2.

policy:
  type: pi05-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 2
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: simpler/bridge
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/bridge
  config_subdirs: [success]

output_dir: /data/zjr/simpler_lerobot/runs/pi05_flashvla_bridge_overnight
job_name: pi05-flashvla-bridge-overnight
batch_size: 2                # injected by render_cfg.sh
grad_accum_steps: 16         # injected by render_cfg.sh (= 32 // bs)
steps: 4000
num_workers: 4
seed: 1000

fsdp:
  enable: true
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: true          # single card: 30 GB AdamW state lives on CPU
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adamw                # injected by render_cfg.sh
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 300
  peak_lr: 5.0e-5
  decay_lr: 2.5e-7
  num_decay_steps: 4000

save_checkpoint: true
save_freq: 250
checkpoint_keep_last: 8
checkpoint_keep_every_n_steps: 0

log_freq: 50
wandb:
  enable: false
  project: p3-overnight-bridge
  entity: null
  disable_artifact: true
