# FlashVLA on SIMPLER / bridge (widowx, 5 Hz) — second robot family.
#
# Only `root`, the frame budget and the step count differ from the fractal config:
# the feature schema is identical across both families on purpose (decision 3,
# `3_2_todo.md` §3.2 — one image key `observation.images.top` everywhere).
#
# bridge is much smaller (17_784 frames for [success]), so 12_000 steps would be
# 21.6 epochs; start at 4_000 (≈ 7 epoch) per `3_2_todo.md` §7.

policy:
  type: pi05-flashvla
  pretrained_path: lerobot/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  num_buffer_slots: 4       # 4 x 4 frames = 16 frames ≈ 3.2 s at 5 Hz
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 2
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: simpler/bridge
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/bridge
  config_subdirs: [success]

output_dir: /data/zjr/simpler_lerobot/runs/pi05_flashvla_bridge_success
job_name: pi05-flashvla-bridge-success
batch_size: 8
grad_accum_steps: 4
steps: 4000                 # 17_784 frames / 32 = 556 step/epoch -> 7.2 epoch
num_workers: 4
seed: 1000

fsdp:
  enable: true
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 300
  peak_lr: 5.0e-5
  decay_lr: 2.5e-7
  num_decay_steps: 4000

save_checkpoint: true
save_freq: 1000
checkpoint_keep_last: 5
checkpoint_keep_every_n_steps: 0

log_freq: 50
wandb:
  enable: true
  project: flashvla-simpler-bridge
  entity: null
  disable_artifact: true
