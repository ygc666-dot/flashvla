policy:
  type: pi05-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 2
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD
dataset:
  repo_id: simpler/bridge
  video_backend: torchcodec
robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/bridge
  config_subdirs:
  - success
output_dir: /data/zjr/simpler_lerobot/runs/pi05_flashvla_bridge_overnight
job_name: pi05-flashvla-bridge-overnight
batch_size: 4
grad_accum_steps: 8
steps: 4000
num_workers: 4
seed: 1000
fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB
use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 300
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 4000
save_checkpoint: true
save_freq: 250
checkpoint_keep_last: 8
checkpoint_keep_every_n_steps: 0
log_freq: 50
wandb:
  enable: false
  project: p3-overnight-bridge
  entity: null
  disable_artifact: true
