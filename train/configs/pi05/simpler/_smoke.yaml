# P3 smoke test (`3.4_todo.md` §4) — never used for a real run.
#
# Purpose: prove the pipeline end-to-end on GPU4 in a few minutes (data ->
# preprocessor -> policy -> loss -> optimizer step -> checkpoint -> reload)
# before spending hours on T0 or the overnight run.
#
# Deliberate choices:
#   * `steps: 2` / `bs: 1`      -> two optimizer steps are enough to see a finite loss
#   * `save_freq: 1`            -> S3 can check the checkpoint is reloadable
#   * `pretrained_path` is the *same* local base checkpoint the overnight run uses,
#     so a missing/unexpected-key problem shows up here (S2) instead of 3 h into
#     the real run. Fallback if it fails: ckpt/flashvla-pi05-libero.
#   * fsdp is off in this template; S0 overrides it from the CLI
#     (`--fsdp.enable=true --fsdp.cpu_offload=true`).

policy:
  type: pi05-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi05_base
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  state_cond: true
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 2
  freeze_vision_encoder: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs: [success]

output_dir: /tmp/p3_smoke
job_name: p3-smoke
batch_size: 1
grad_accum_steps: 1
steps: 2
num_workers: 0
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  # No `betas` here on purpose: S0/S5 override `optimizer.type` to `adafactor`
  # from the CLI, and draccus rejects `betas` for that config class. These runs
  # only measure memory and step time, so AdamW's default betas are fine.
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 5.0e-5
  decay_lr: 2.5e-7
  num_decay_steps: 2

save_checkpoint: true
save_freq: 1
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0

log_freq: 1
wandb:
  enable: false
  project: p3-smoke
  entity: null
  disable_artifact: true
