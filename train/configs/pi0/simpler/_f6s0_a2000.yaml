# F6 / S0 臂 A（对照，2000 步延长版）：state_proj = N(0, 1e-3)，无 proprio 先验。
#
# 唯一来源：docs/sdn_flashvla/pi0_flashvla/f6.md §S0。相对
# `pi0_flashvla_fractal.yaml` 只改 4 处（pretrained_path / output_dir /
# steps / save_freq / checkpoint_keep_last），F1/F2/F3 的配方
# （QUANTILES + mask_padded_action_dims + state_path_lr_mult +
# num_decay_steps 12000）一律不动，否则 A/B 失去归因。
#
# 起点：ckpt/pi0star_fractal_flashvla（--state-proj-init-std 1e-3 转出）

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  mask_padded_action_dims: true      # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES                # F1
    ACTION: QUANTILES               # F1

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /data/zjr/simpler_lerobot/runs/f6_s0_a_fractal2000
job_name: f6-s0-a-fractal2000
batch_size: 4
grad_accum_steps: 8
steps: 2000
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 12000

state_path_lr_mult: 3.0       # F3

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 1000
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0
log_freq: 50
wandb:
  enable: false
  project: p4-f6-s0
  entity: null
  disable_artifact: true
