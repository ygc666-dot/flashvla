# F6 / S2 的**两路对照** smoke：与 `_f6s2_smoke.yaml` 逐行相同，只改
#   pretrained_path   -> S0-B 起点 ckpt（`state_proj` <- π0* `proprio_encoder`）
#   use_proprio_stack -> false
#   proprio_dim       -> 0
#   output_dir / job_name
# 作用是给出「同 seed / 同 bs4×accum8 / 同样 2 步」的两路 loss，供三路对照
# （判据：两路与三路的 loss 同量级，不期望三路更小）。
#
# 起点由下面这条命令产出（π0* 的 proprio 与 action 共用权重，
# `pizero.py:274-276`，所以只多出 proprio_in_proj 一个 1024x8 编码器）：
#   $PY scripts/p4/convert_pi0star.py \
#     --src third_party/SDN/pretrained/open-pi-zero/fractal_beta_step29576_2024-12-29_13-10_42.pt \
#     --data /data/zjr/simpler_lerobot/fractal/google_robot_close_drawer/success \
#     --empty-cameras 0 --write --dst ckpt/pi0star_fractal_flashvla_proprio \
#     --emit-proprio-stack --proprio-layout flashvla_quat \
#     --json logs/p4/convert_fractal_proprio_stack_write.json
#
#   CUDA_VISIBLE_DEVICES=4 bash train/train.sh train/configs/pi0/simpler/_f6s2_smoke.yaml 1

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla_proprio
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  use_proprio_stack: false          # 两路对照（S0-B 起点：state_proj <- 编码器）
  proprio_dim: 0
  mask_padded_action_dims: true     # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES                # F1
    ACTION: QUANTILES               # F1

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /home/zjr/workspace_tj/StreamingVLA/flashvla/runs/f6_s2_ref2s_smoke_fractal
job_name: f6-s2-ref2s-smoke-fractal
batch_size: 4
grad_accum_steps: 8
steps: 2
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 2

state_path_lr_mult: 3.0       # F3（三路下覆盖 state_proj + proprio_in_proj）

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 1
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0
log_freq: 1
wandb:
  enable: false
  project: p4-f6-s2
  entity: null
  disable_artifact: true
