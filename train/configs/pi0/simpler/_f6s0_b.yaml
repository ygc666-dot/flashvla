# F6 / S0 臂 B（处理）：state_proj ← π0* fractal 的 proprio_encoder，
# 且按 FlashVLA 的 state 布局做了列置换（四元数 wxyz + 夹爪取反）。
#
# 与 `_f6s0_a.yaml` 逐行相同，只有 pretrained_path / output_dir / job_name 不同。
#
# 起点由下面这条命令产出（f6.md 原文 + --proprio-layout flashvla_quat）：
#   $PY scripts/p4/convert_pi0star.py \
#     --src third_party/SDN/pretrained/open-pi-zero/fractal_beta_step29576_2024-12-29_13-10_42.pt \
#     --data /data/zjr/simpler_lerobot/fractal/google_robot_close_drawer/success \
#     --empty-cameras 0 --write --dst ckpt/pi0star_fractal_flashvla_proprio \
#     --map-proprio-to-state --proprio-layout flashvla_quat \
#     --json logs/p4/convert_fractal_proprio.json
#
# 为什么需要 --proprio-layout flashvla_quat：π0* fractal 的 proprio 是
# `[x,y,z,qx,qy,qz,qw,1-grip]`（EDRSimplerAdapter.preprocess_proprio），
# 我们的 state 是 `[x,y,z,qw,qx,qy,qz,grip]`（convert_simpler_to_lerobot.py
# STATE_NAMES）。8 维同形但 5 维错位，直接拷会把预训练编码器接到错输入上。

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla_proprio
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  mask_padded_action_dims: true      # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES                # F1
    ACTION: QUANTILES               # F1

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /data/zjr/simpler_lerobot/runs/f6_s0_b_fractal500
job_name: f6-s0-b-fractal500
batch_size: 4
grad_accum_steps: 8
steps: 500
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 12000

state_path_lr_mult: 3.0       # F3

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 500
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0
log_freq: 50
wandb:
  enable: false
  project: p4-f6-s0
  entity: null
  disable_artifact: true
