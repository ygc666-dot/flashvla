# F6 / S5 臂②：三路 + `proprio_in_proj` ← **随机** N(0, 0.1)（fractal，2000 步）。
#
# 与臂③（`_f6s5_3.yaml`）**只差一行** `proprio_in_proj_init_std`：两者共用同一份
# 三路 ckpt，训练启动瞬间把 `proprio_in_proj` 覆盖成 N(0, 0.1)，因此两臂的差异
# 精确等于"π0* 的预训练编码器值多少"。与臂①（`_f6s0_b2000.yaml`，两路 + 编码器
# 装在 `state_proj`）相比则只差 state token 的产出路径。
#
# 尺度必须是 O(0.1)：`f6_s0_s1.md` §7.4 实测 N(0, 1e-3) 在 Adafactor 下结构性冻结
# （相对步长被参数自身 RMS 相对化），用小初始化会让本臂变成第二个"死路"。
#
#   CUDA_VISIBLE_DEVICES=4 bash train/train.sh train/configs/pi0/simpler/_f6s5_2.yaml 1

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla_proprio_stack
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  use_proprio_stack: true           # S5 的唯一变量：state token 走 proprio 栈
  proprio_dim: 0                    # 0 = 取 dataset 的 observation.state 宽度（8）
  mask_padded_action_dims: true     # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES                # F1
    ACTION: QUANTILES               # F1

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /home/zjr/workspace_tj/StreamingVLA/flashvla/runs/f6_s5_2_fractal2000
job_name: f6-s5-2-fractal2000
batch_size: 4
grad_accum_steps: 8
steps: 2000
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 12000

state_path_lr_mult: 3.0       # F3（三路下覆盖 state_proj + proprio_in_proj）
proprio_in_proj_init_std: 0.1 # 本臂的唯一变量：抹掉 π0* 的编码器，保留结构

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 1000
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 0
log_freq: 50
wandb:
  enable: false
  project: p4-f6-s5
  entity: null
  disable_artifact: true
