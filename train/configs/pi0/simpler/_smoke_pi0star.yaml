# π0* → `pi0-flashvla` 冒烟配置：只跑 2 步，回答「权重能否加载、loss 是否有限、
# 存盘能否重载、显存多少」。判据见 `docs/sdn_flashvla/flashvla_simpler/4_pi0star_flashvla.md` §5 S3–S5。
#
#   CUDA_VISIBLE_DEVICES=4 bash train/train.sh train/configs/pi0/simpler/_smoke_pi0star.yaml 1
#
# 只取一个任务叶子（roots 模式），避免冒烟时扫 4 个任务的数据。

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_bridge_flashvla
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  mask_padded_action_dims: true
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES
    ACTION: QUANTILES

dataset:
  repo_id: simpler/bridge_smoke
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  roots:
  - /data/zjr/simpler_lerobot/bridge/widowx_stack_cube/success

output_dir: /tmp/p4_smoke_pi0star_f123
job_name: pi0-flashvla-smoke-f123
batch_size: 1
grad_accum_steps: 1
steps: 2
num_workers: 0
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 2

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 1
checkpoint_keep_last: 2
log_freq: 1
wandb:
  enable: false
  project: p4-pi0star-smoke
  entity: null
  disable_artifact: true
