# π0* → `pi0-flashvla` 显存/吞吐扫描（S4，bs=4）。10 步、不存盘。
#   CUDA_VISIBLE_DEVICES=4 bash train/train.sh train/configs/pi0/simpler/_sweep_pi0star_bs4.yaml 1

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_bridge_flashvla
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: simpler/bridge_sweep_bs4
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/bridge
  config_subdirs:
  - success

output_dir: /tmp/p4_sweep_bs4
job_name: pi0-flashvla-sweep-bs4
batch_size: 4
grad_accum_steps: 8
steps: 10
num_workers: 4
seed: 1000

fsdp:
  enable: false

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 10

flashvla_init:
  mode: default

save_checkpoint: false
save_freq: 1000
checkpoint_keep_last: 0
log_freq: 1
wandb:
  enable: false
  project: p4-pi0star-sweep
  entity: null
  disable_artifact: true
