# F7 / P0：把 `_f6s5_3_8000.yaml` 的归一化从 QUANTILES 换回 MEAN_STD（**单变量**）。
#
# 为什么：`f7_next_steps.md` §3.3 —— close_drawer × 50 seeds 上
#   老锚点（MEAN_STD / 两路 / 12k）= 46% > 本配方（QUANTILES / 三路 / 8k）= 34%，
#   而两者的离线运动维 MAE 只差 3.4%。头号嫌疑是 QUANTILES 在闭环里把 OOD state 饱和截断。
# 与本文件的原型（`_f6s5_3_8000.yaml`）逐行相同，只差 4 行：
#   normalization_mapping.STATE / ACTION  →  MEAN_STD
#   output_dir / job_name                 →  f7_s1_fractal8000_meanstd
# 其余（三路、8000 步、500 warmup + 8000 decay、bs4×accum8、state_path_lr_mult=3.0、
# mask_padded_action_dims=true（action 本就是 7 维，无 padding → no-op））逐行不动。
#
#   PATH=<flashvla env>/bin:$PATH CUDA_VISIBLE_DEVICES=4 bash train/train.sh \
#     train/configs/pi0/simpler/_f7s1_meanstd.yaml 1
policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla_proprio_stack
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  use_proprio_stack: true           # S5 的唯一变量：state token 走 proprio 栈
  proprio_dim: 0                    # 0 = 取 dataset 的 observation.state 宽度（8）
  mask_padded_action_dims: true     # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: MEAN_STD
    ACTION: MEAN_STD

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /home/zjr/workspace_tj/StreamingVLA/flashvla/runs/f7_s1_fractal8000_meanstd
job_name: f7-s1-fractal8000-meanstd
batch_size: 4
grad_accum_steps: 8
steps: 8000
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 8000

state_path_lr_mult: 3.0       # F3（三路下覆盖 state_proj + proprio_in_proj）

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 500
checkpoint_keep_last: 2
checkpoint_keep_every_n_steps: 2000   # 保留 2000/4000/6000 供探针（仅保留策略，不改配方）
log_freq: 50
wandb:
  enable: false
  project: p4-f6-s5
  entity: null
  disable_artifact: true
