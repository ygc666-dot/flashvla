# π0*（open-pi-zero fractal_beta）→ FlashVLA `pi0-flashvla`，SIMPLER / Fractal google_robot。
#
# 方案、映射表与门禁见 `docs/sdn_flashvla/pi0_flashvla/4_pi0star_flashvla.md`；
# F1/F2/F3/F4 见 `docs/sdn_flashvla/pi0_flashvla/pi_star_analysis.md` §5（与 bridge 同病，同修）。
# 起点由下面这条命令产出（与 bridge 只有 --src / --data / --dst 不同）：
#   PY=/home/zjr/workspace_tj/StreamingVLA/miniconda_ygc/envs/flashvla/bin/python
#   $PY scripts/p4/convert_pi0star.py \
#     --src third_party/SDN/pretrained/open-pi-zero/fractal_beta_step29576_2024-12-29_13-10_42.pt \
#     --data /data/zjr/simpler_lerobot/fractal/google_robot_close_drawer/success \
#     --empty-cameras 0 --write --dst ckpt/pi0star_fractal_flashvla \
#     --state-proj-init-std 1e-3 --json logs/p4/convert_fractal.json

policy:
  type: pi0-flashvla
  pretrained_path: /home/zjr/workspace_tj/StreamingVLA/flashvla/ckpt/pi0star_fractal_flashvla
  push_to_hub: false
  dtype: bfloat16
  device: cuda
  num_buffer_slots: 4
  chunk_size: 4
  n_action_steps: 4
  empty_cameras: 0
  cold_start_mode: zero_delta
  use_adarms_time_cond: false
  mask_padded_action_dims: true      # F2
  normalization_mapping:
    VISUAL: IDENTITY
    STATE: QUANTILES                # F1
    ACTION: QUANTILES               # F1

dataset:
  repo_id: simpler/fractal
  video_backend: torchcodec

robotwin_multitask:
  enable: true
  root: /data/zjr/simpler_lerobot/fractal
  config_subdirs:
  - success

output_dir: /data/zjr/simpler_lerobot/runs/pi0_flashvla_fractal_q12000   # F4：新开 run
job_name: pi0-flashvla-fractal-q12000
batch_size: 4                 # 50_843 帧；bs4×accum8 → 1_589 step/epoch → 12_000 步 ≈ 7.6 epoch
grad_accum_steps: 8
steps: 12000
num_workers: 4
seed: 1000

fsdp:
  enable: false
  mixed_precision: bf16
  reduce_dtype: float32
  reshard_after_forward: false
  cpu_offload: false
  state_dict_type: SHARDED_STATE_DICT
  save_pretrained_max_shard_size: 50GB

use_policy_training_preset: false
optimizer:
  type: adafactor
  lr: 5.0e-05
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  peak_lr: 5.0e-05
  decay_lr: 2.5e-07
  num_decay_steps: 12000

state_path_lr_mult: 3.0       # F3

flashvla_init:
  mode: default

save_checkpoint: true
save_freq: 500
checkpoint_keep_last: 6
checkpoint_keep_every_n_steps: 0
log_freq: 50
wandb:
  enable: false
  project: p4-pi0star-fractal
  entity: null
  disable_artifact: true
